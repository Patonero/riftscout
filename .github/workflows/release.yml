name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(jq -r .version manifest.json)
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage extension files
        run: |
          mkdir -p staging/riftscout
          cp manifest.json background.js content.js content.css staging/riftscout/
          cp -r icons staging/riftscout/

      - name: Zip extension
        run: |
          mkdir -p dist
          cd staging
          zip -r "../dist/riftscout-${{ steps.tag.outputs.tag }}.zip" riftscout

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/*.zip
          generate_release_notes: true
